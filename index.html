<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Nabila</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #chat-box { max-height: 400px; overflow-y: auto; margin-bottom: 10px; }
        #user-input { width: 300px; padding: 10px; }
    </style>
</head>
<body>
    <h1>Chat dengan Nabila</h1>
    <div id="chat-box"></div>
    <input type="text" id="user-input" placeholder="Tulis pesan..." />
    <button onclick="sendMessage()">Kirim</button>

    <script>
        async function sendMessage() {
            const input = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const userMessage = input.value;
            if (!userMessage.trim()) return;

            chatBox.innerHTML += `<p><strong>Kamu:</strong> ${userMessage}</p>`;
            input.value = "";

            const response = await fetch("http://localhost:3000/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: userMessage })
            });

            const data = await response.json();
            const reply = data.choices?.[0]?.message?.content || "Maaf, aku tidak mengerti.";
            chatBox.innerHTML += `<p><strong>Nabila:</strong> ${reply}</p>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
