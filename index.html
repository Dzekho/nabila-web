<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Nabila - AI Chat</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    #chat-box { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; }
    input { width: 80%; padding: 10px; }
    button { padding: 10px; }
  </style>
</head>
<body>
  <h1>Halo, aku Nabila!</h1>
  <div id="chat-box"></div>
  <input id="user-input" type="text" placeholder="Tulis pesan di sini..." />
  <button onclick="sendMessage()">Kirim</button>

  <script>
    async function sendMessage() {
      const input = document.getElementById("user-input");
      const chatBox = document.getElementById("chat-box");
      const userMessage = input.value;
      if (!userMessage.trim()) return;

      chatBox.innerHTML += `<p><strong>Kamu:</strong> ${userMessage}</p>`;
      input.value = "";

      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: userMessage })
      });

      const data = await response.json();
      const reply = data.reply || "Maaf, aku tidak mengerti.";
      chatBox.innerHTML += `<p><strong>Nabila:</strong> ${reply}</p>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
